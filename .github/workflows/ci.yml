name: CI

# `main` = production, `develop` = intégration : toute PR vers l'une ou
# l'autre doit passer la CI (même règle que le backend).
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sans `version` : l'action lit `packageManager` (pnpm@12.3.4) dans
      # package.json. Une version explicite différente fait échouer l'action.
      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm eslint .

      - name: Format Check (Prettier)
        run: pnpm prettier --check .

      - name: Typecheck
        run: pnpm tsc --noEmit

      # Le frontend ne doit pas dériver du contrat : generated.ts doit être
      # exactement ce que produit openapi.json (docs/contrat-api.md).
      - name: API types up to date
        run: |
          pnpm api:types
          git diff --exit-code src/lib/api/generated.ts || {
            echo "::error::src/lib/api/generated.ts est obsolète : lancez pnpm api:types et committez le fichier."
            exit 1
          }

      - name: Security Audit
        run: pnpm audit --prod

      - name: Unit Tests
        run: pnpm test --run

      - name: Build Next.js
        run: pnpm build
