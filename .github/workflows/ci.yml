name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Using npm per typical environments, although pnpm is in workspace. Let's use pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm eslint .

      - name: Format Check (Prettier)
        run: pnpm prettier --check .

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Security Audit
        run: pnpm audit --prod

      - name: Unit Tests
        run: pnpm test --run

      - name: Build Next.js
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

