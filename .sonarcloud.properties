# Configuration de l'analyse automatique SonarCloud.
#
# src/lib/api/generated.ts est produit par openapi-typescript
# (`pnpm api:types`, depuis openapi.json) et ne s'édite jamais à la main
# (CLAUDE.md) : sa structure répétitive (une entrée par opération d'API)
# n'est pas une duplication de code à factoriser. Il reste analysé pour le
# reste (bugs, sécurité), seulement exclu de la détection de duplication.
sonar.cpd.exclusions=src/lib/api/generated.ts
